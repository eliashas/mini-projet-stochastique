[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sma-brest"
version = "0.1.0"
description = "Expériences probabilistes reproductibles des extrêmes annuels de Brest"
requires-python = ">=3.12"
dependencies = ["numpy", "pandas", "scipy", "matplotlib", "torch", "PyYAML", "nbformat", "nbclient", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
